<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Gallery — Bridgestone Cup</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.googleapis.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/admin-gallery.css?v=20260826-multi-crop-v2"></head>
<body><main class="gallery-admin"><header><div><small>BRIDGESTONE CUP BP 2026</small><h1>GALLERY CONTROL ROOM</h1></div><nav><a href="admin.html">Dashboard</a></nav></header><section class="layout"><form id="gallery-form"><h2>Tambah Media</h2><label for="photo">File foto atau video <small>Pilih banyak foto sekaligus · foto akan dicrop satu per satu</small></label><input id="photo" name="photo" type="file" accept="image/*,video/*,.heic,.heif" multiple required><div id="file-preview" class="file-preview" aria-live="polite"></div><label for="sport">Cabang olahraga</label><select id="sport" name="sport"><option value="">Umum / Semua olahraga</option></select><div class="row"><label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label></div><button class="primary" type="submit">Upload dan simpan semua</button><output id="form-status" role="status" aria-live="polite"></output></form><section class="library"><div class="library-heading"><div><small>MEDIA LIBRARY</small><h2>Foto Tersimpan</h2></div><button id="refresh-button" type="button">Muat ulang</button></div><div id="gallery-items" class="items"><p>Memuat foto…</p></div></section></section></main><div id="crop-modal" class="crop-modal" hidden><div class="crop-dialog"><div class="crop-heading"><div><small>PHOTO CROP</small><h2>Atur foto Gallery</h2><p id="crop-counter"></p></div><button id="crop-cancel" type="button">Batal</button></div><div class="crop-stage"><canvas id="crop-canvas" width="1200" height="675"></canvas></div><p class="crop-instruction">Tarik kotak dan sudutnya untuk memilih area foto.</p><div class="crop-actions"><button id="crop-skip" type="button">Lewati crop</button><button id="crop-apply" class="primary" type="button">Simpan crop &amp; foto berikutnya</button></div></div></div><script type="module" src="../js/admin-gallery.js?v=20260826-multi-crop-v2"></script></body></html>
