<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Gallery — Bridgestone Cup</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/admin-gallery.css?v=20260808-1"></head>
<body><main class="gallery-admin"><header><div><small>BRIDGESTONE CUP BP 2026</small><h1>GALLERY CONTROL ROOM</h1></div><nav><a href="admin.html">Dashboard</a></nav></header>
<section class="layout"><form id="gallery-form"><h2>Tambah Media</h2><label for="photo">File foto atau video <small>Termasuk HEIC/HEIF iPhone · maksimal 50 MB</small></label><input id="photo" name="photo" type="file" accept="image/*,video/*,.heic,.heif" required><label for="sport">Cabang olahraga</label><select id="sport" name="sport"><option value="">Umum / Semua olahraga</option></select><div class="row"><label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label></div><button class="primary" type="submit">Upload dan simpan</button><output id="form-status" role="status" aria-live="polite"></output></form>
<section class="library"><div class="library-heading"><div><small>MEDIA LIBRARY</small><h2>Foto Tersimpan</h2></div><button id="refresh-button" type="button">Muat ulang</button></div><div id="gallery-items" class="items"><p>Memuat foto…</p></div></section></section></main><script type="module" src="../js/admin-gallery.js?v=20260808-1"></script></body></html>
