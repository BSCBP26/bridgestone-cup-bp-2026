<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Exhibition Match — Bridgestone Cup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin-gallery.css?v=20260825-exhibition"><link rel="stylesheet" href="../css/admin-greetings.css?v=20260825-exhibition-v3">
</head>
<body><main class="gallery-admin">
  <header><div><small>BRIDGESTONE CUP BP 2026</small><h1>EXHIBITION MATCH CONTROL ROOM</h1></div><nav><a href="admin.html">Dashboard</a></nav></header>
  <section class="layout">
    <form id="greeting-form">
      <h2 id="form-title">Tambah Exhibition Match</h2><input name="id" type="hidden">
      <label>Foto panel <small>Pilih beberapa foto untuk slideshow panel</small></label>
      <input name="photo" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <small id="photo-help" class="field-help">Saat edit, foto lama tetap dipakai jika tidak memilih foto baru.</small>
      <label>Nama / label konten</label><input name="name" maxlength="120" required>
      <label>Subjudul (Indonesia)</label><input name="roleId" maxlength="160" required>
      <label>Subjudul (English)</label><input name="roleEn" maxlength="160">
      <label>Penjelasan (Indonesia)</label><textarea name="messageId" rows="5" maxlength="1200" required></textarea>
      <label>Penjelasan (English)</label><textarea name="messageEn" rows="5" maxlength="1200"></textarea>
      <div class="row"><label>Urutan<input name="sortOrder" type="number" min="0" value="0"></label><label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label></div>
      <div class="form-actions"><button class="primary" type="submit">Simpan Exhibition Match</button><button id="cancel-edit" type="button" hidden>Batal edit</button></div><output id="form-status" role="status" aria-live="polite"></output>
    </form>
    <section class="library"><div class="library-heading"><div><small>EXHIBITION MATCH LIBRARY</small><h2>Panel Exhibition Tersimpan</h2></div><button id="refresh-button" type="button">Muat ulang</button></div><div id="greeting-items" class="items greeting-items"><p>Memuat Exhibition Match…</p></div></section>
  </section>
</main><script type="module" src="../js/admin-greetings.js?v=20260825-exhibition-v3"></script></body></html>
