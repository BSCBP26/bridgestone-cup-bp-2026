<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Greetings — Bridgestone Cup</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/admin-gallery.css?v=20260808-greetings"><link rel="stylesheet" href="../css/admin-greetings.css?v=20260808-1"></head>
<body><main class="gallery-admin"><header><div><small>BRIDGESTONE CUP BP 2026</small><h1>GREETING CONTROL ROOM</h1></div><nav><a href="admin.html">Dashboard</a></nav></header>
<section class="layout"><form id="greeting-form"><h2 id="form-title">Tambah Greeting</h2><input name="id" type="hidden"><label>Foto <small>Opsional · JPG, PNG, WebP · maksimal 8 MB</small></label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp"><label>Nama</label><input name="name" maxlength="120" required><label>Jabatan (Indonesia)</label><input name="roleId" maxlength="160" required><label>Jabatan (English)</label><input name="roleEn" maxlength="160"><label>Pesan (Indonesia)</label><textarea name="messageId" rows="5" maxlength="1200" required></textarea><label>Pesan (English)</label><textarea name="messageEn" rows="5" maxlength="1200"></textarea><div class="row"><label>Urutan<input name="sortOrder" type="number" min="0" value="0"></label><label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label></div><div class="form-actions"><button class="primary" type="submit">Simpan Greeting</button><button id="cancel-edit" type="button" hidden>Batal edit</button></div><output id="form-status" role="status" aria-live="polite"></output></form>
<section class="library"><div class="library-heading"><div><small>GREETING LIBRARY</small><h2>Greeting Tersimpan</h2></div><button id="refresh-button" type="button">Muat ulang</button></div><div id="greeting-items" class="items greeting-items"><p>Memuat greeting…</p></div></section></section></main><script type="module" src="../js/admin-greetings.js?v=20260808-1"></script></body></html>
