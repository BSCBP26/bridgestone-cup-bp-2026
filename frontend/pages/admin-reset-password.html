<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><main class="login-shell"><section class="login-card">
  <small>BRIDGESTONE CUP BP 2026</small><h1 id="reset-title">RESET PASSWORD</h1><p id="reset-description">Masukkan email admin untuk menerima link reset password.</p>
  <form id="request-reset-form"><label for="reset-email">Email admin</label><input id="reset-email" name="email" type="email" autocomplete="email" required><button type="submit">Kirim link reset</button></form>
  <form id="update-password-form" hidden><label for="new-password">Password baru</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm-password">Ulangi password baru</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Simpan password baru</button></form>
  <output id="reset-status" role="status" aria-live="polite"></output><a href="admin-login.html">Kembali ke login admin</a>
</section></main><script type="module" src="../js/admin-reset-password.js?v=20260809-1"></script></body>
