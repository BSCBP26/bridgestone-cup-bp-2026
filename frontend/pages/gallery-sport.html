<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sport Gallery — Bridgestone Cup BP 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=DM+Sans:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/gallery.css?v=20260812-gallery-nav-v2">
  <link rel="stylesheet" href="../css/gallery-live.css?v=20260809-mobile-layout">
</head>
<body>
  <main class="gallery-page sport-collection">
    <header class="gallery-topbar">
      <a class="back-link" href="gallery.html">← ALL PHOTOS</a>
      <a class="gallery-brand" href="../index.html">BRIDGESTONE CUP BP 2026</a>
      <button class="language-toggle gallery-language-toggle" type="button" aria-label="Ganti bahasa"><span>ID</span><span>EN</span></button>
    </header>
    <section class="gallery-content" aria-labelledby="sport-gallery-title">
      <header class="gallery-heading"><p>COMPLETE SPORT COLLECTION</p><h1 id="sport-gallery-title">SPORT MOMENTS</h1><span>Loading published tournament photos.</span></header>
      <nav class="gallery-filters" id="gallery-filters" aria-label="Pilih gallery olahraga"></nav>
      <div class="moments-grid" id="moments-grid"></div>
    </section>
    <footer class="gallery-footer"><b id="archive-count">0 MOMENTS ARCHIVED</b><span>BRIDGESTONE CUP BP 2026</span><small id="footer-sport"></small></footer>
  </main>
  <dialog class="lightbox" id="gallery-lightbox" aria-labelledby="lightbox-title">
    <button class="lightbox-close" type="button" aria-label="Tutup foto">×</button>
    <button class="lightbox-arrow previous" type="button" aria-label="Foto sebelumnya">‹</button>
    <div class="lightbox-image" id="lightbox-image"><img id="lightbox-photo" alt="" hidden><span id="lightbox-number"></span></div>
    <div class="lightbox-caption"><small id="lightbox-sport"></small><h2 id="lightbox-title"></h2><p>BRIDGESTONE CUP BP 2026</p></div>
    <button class="lightbox-arrow next" type="button" aria-label="Foto berikutnya">›</button>
  </dialog>
  <script type="module" src="../js/gallery.js?v=20260812-gallery-nav-v2"></script>
</body>
</html>
